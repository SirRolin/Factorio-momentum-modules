turbo-module-3-mom=A module to speed up the machine when needed.\ncurrent momentum: __1__.\nMax stats are that of a speed module 3 * scaling.

clean-module-1-mom=A weaker speed module with no quality penalty and a bit less pollution.\ncurrent momentum: __1__.\nMax stats are 65% of a speed module 1 * scaling, with the quality malus removed.
clean-module-2-mom=A weaker speed module with no quality penalty and a bit less pollution.\ncurrent momentum: __1__.\nMax stats are 65% of a speed module 2 * scaling, with the quality malus removed.
clean-module-3-mom=A weaker speed module with no quality penalty and a bit less pollution.\ncurrent momentum: __1__.\nMax stats are 65% of a speed module 3 * scaling, with the quality malus removed.

