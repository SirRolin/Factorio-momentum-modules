[mod-setting-name]
sr-mom-ramping-mode=Ramping Mode
sr-mom-ramping-speed=Ramping Rate
sr-mom-tier-up-recipe=Tier up recipe

[mod-setting-description]
sr-mom-ramping-mode=All means that all modules ramp at the same time.\nSequential means left most module gets ramped up first and rightmost module gets ramped down first.\nBalanced means it spreads out ramping and deramping across the modules.
sr-mom-ramping-speed=How many seconds between each update to modules.
sr-mom-tier-up-recipe=Adds a second recipe for tier 2 and 3 momentum modules, made from the previous tier's momentum modules plus the rest of the normal module upgrade cost, the same way vanilla modules are upgraded.

