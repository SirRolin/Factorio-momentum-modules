[mod-setting-name]
sr-mom-ramping-mode=Ramping Mode
sr-mom-ramping-speed=Ramping Rate
sr-mom-ramping-max-scaling=Modules Max Scaling
sr-mom-ramping-min-scaling=Modules Min Scaling
sr-mom-ramping-threshold-scaling=Threshold Modules Scaling
sr-mom-ramping-cold-scaling=Transitioning Modules Cold Scaling
sr-mom-ramping-hot-scaling=Transitioning Modules Hot Scaling

[mod-setting-description]
sr-mom-ramping-mode=All means that all modules ramp at the same time.\nSequential means left most module gets ramped up first and rightmost module gets ramped down first.\nBalanced means it spreads out ramping and deramping across the modules.
sr-mom-ramping-speed=How many seconds between each update to modules.
sr-mom-ramping-max-scaling=How strong the modules are at 10 ramp compared to vanilla modules (excluding threshold modules)
sr-mom-ramping-min-scaling=How strong the modules are at 0 ramp compared to vanilla modules (excluding threshold modules)
sr-mom-ramping-threshold-scaling=How strong the threshold modules are compared to vanilla modules.
sr-mom-ramping-cold-scaling=How strong a transitioning module's cold (0 momentum) effects are compared to vanilla modules. Set to 0 to disable the cold-state penalty entirely.
sr-mom-ramping-hot-scaling=How strong a transitioning module's hot (10 momentum) effects are compared to vanilla modules.

